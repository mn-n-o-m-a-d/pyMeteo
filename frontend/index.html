<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wetter Übersicht</title>
</head>
<body>
    fetch('Wien.json')
  .then(response => response.json())
  .then(data => {
    document.getElementById('temp').innerText = data.temperature + "°C";
  });
</body>
</html>
